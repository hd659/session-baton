[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "session-baton"
version = "0.1.0"
description = "Cross-harness relay: pack handoff batons from Claude/Codex/Pi logs + git, then phase-fold review the work."
requires-python = ">=3.9"
dependencies = ["rich>=12"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
baton = "session_baton.cli:main"

[tool.setuptools]
packages = ["session_baton"]

[tool.pytest.ini_options]
testpaths = ["tests"]
